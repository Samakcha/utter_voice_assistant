# Voice Assistant Configuration (macOS Apple Silicon)
# All tunable parameters (hotkeys, silence timeouts, thresholds, paths) are defined here.

[hotkeys]
# Global hotkey for Command Mode (interprets and executes voice actions)
command_mode = "<ctrl>+<alt>+m"

# Global hotkey for Dictation Mode (speech-to-text dictation into focused field)
dictation_mode = "<ctrl>+<alt>+d"

# Global hotkey to cancel the current listening session immediately
cancel = "<esc>"

# Hold-to-talk for dictation. Tap Control+Option+D to start and tap again to stop (as
# before), OR hold it while you speak and the text is pasted when you let go.
# Hotkeys are matched by physical key position (US layout), and the app swallows its own
# hotkeys so the focused app never sees them. Set to false to go back to the previous
# press-only hotkey listener (tap to toggle only).
hold_to_talk = true

# A press held at least this long (seconds) counts as a hold; shorter is a tap (toggle)
hold_min_sec = 0.4

# Keep recording this long (seconds) after you let go, so the last word isn't cut off
hold_release_tail_sec = 0.3

[timeouts]
# Duration of silence (in seconds) required after speech to auto-stop command mode
command_silence_sec = 1.5

# Early finish for fixed commands ("open notes", "take a note", "open WhatsApp"):
# after this much silence the speech so far is transcribed in the background, and if it is
# one of those complete commands and you are still silent when the result is ready
# (about 1 s after you stop), it runs without waiting the full command_silence_sec.
# WhatsApp search (which contains a name) and anything unrecognized still wait the full
# timeout, so a name is never cut off. Set to 0 to turn early finish off.
command_early_check_sec = 0.6

# Time limit (in seconds) to detect initial speech in command mode before quiet cancellation
command_no_speech_sec = 5.0

# Duration of silence (in seconds) required to auto-stop dictation mode
dictation_silence_sec = 8.0

[audio]
# Microphone sampling rate in Hz (16000 Hz required for Silero VAD and Whisper)
sample_rate = 16000

# Audio frame chunk size in samples (512 samples = 32ms window at 16kHz for Silero VAD)
chunk_size = 512

# Number of audio channels (1 = mono)
channels = 1

[vad]
# Confidence threshold (0.0 to 1.0) above which a frame is considered active speech.
# Recommended: 0.35 (reliably detects soft speech down to -25 dBFS; 0.5 can miss soft speech, while ambient noise is < 0.13)
speech_threshold = 0.35

# Minimum consecutive speech chunks before marking session as 'speech detected' (helps ignore brief clicks)
min_speech_chunks = 2

[normalization]
# Whether to normalize audio volume before sending it to Whisper (improves soft/normal speech accuracy)
enabled = true

# Target peak level in dBFS for normalization (default -3.0 dBFS provides 3 dB headroom against clipping)
target_peak_dbfs = -3.0

# Maximum gain boost in dB (default 20.0 dB prevents blowing up background noise on quiet or silent clips)
max_gain_db = 20.0

[storage]
# Where session recordings go, used only when [privacy] keep_recordings = true.
# Kept outside the project folder so personal audio isn't next to the code.
recordings_dir = "~/Library/Application Support/VoiceAssistant/recordings"

# Maximum number of recent recording files to keep in recordings_dir before cleaning older files
max_recordings_kept = 20

# Where note text is backed up if saving to Notes fails (never pruned)
note_backups_dir = "~/Library/Application Support/VoiceAssistant/note_backups"

[whisper]
# Whisper model size or variant: "tiny", "base", "small", "medium", "large-v3-turbo", or English-only ".en" variants
# large-v3-turbo (1.5 GB on disk, ~2.2 GB GPU memory peak, ~0.55 s per utterance on M5) fixed real
# mishearings that small made ("open nodes" -> "open notes"). If its weights are missing from
# models_dir, the app falls back to "small" automatically and never downloads at runtime.
model_size = "large-v3-turbo"

# Language code (ISO 639-1) for transcription ("en" for English)
language = "en"

# Optional initial prompt to bias vocabulary/names (default empty to avoid hallucination)
initial_prompt = ""

# Local directory where downloaded Whisper model weights are stored
models_dir = "./models"

[dictation]
# Duration of silence pause (in seconds) during active dictation that triggers background chunk transcription
chunk_pause_sec = 0.8

# Minimum duration of detected speech (in milliseconds) required in a chunk to send to Whisper (avoids coughs/clicks)
min_speech_ms = 250

# Stop phrases that automatically end dictation when spoken at the end of speech
stop_phrases = ["stop dictation", "end dictation"]

# Maximum fuzzy matching edit distance ratio relative to stop phrase length (0.2 = ~2 edits for 13-14 char phrases)
fuzzy_tolerance = 0.2

# Whether to pass the previous chunk's text as initial prompt context to Whisper
context_prompt = true

# Time to wait (in milliseconds) after Cmd+V before restoring original clipboard contents
clipboard_restore_delay_ms = 400

# Maximum time to wait (in milliseconds) for Control and Option keys to be released before sending Cmd+V
modifier_release_timeout_ms = 500

# Whether to append a trailing space after the inserted text
trailing_space = false

[notes]
# Stop phrases that automatically end a voice note session and trigger saving
stop_phrases = ["stop note", "stop dictation", "end dictation"]

# Duration of silence (in seconds) required to auto-stop a voice note session
silence_sec = 10.0

# Title template for newly created notes ({date} and {time} placeholders)
title_template = "Voice note {date} {time}"

# Notes folder name to save notes into (empty string saves to default folder)
folder = ""

# Whether to bring Notes to the front after saving (false leaves user focus undisturbed)
reveal_after_save = false

# Whether to play a short ready sound when the note recording stream is confirmed open
ready_sound = true

[privacy]
# Whether to redact contact and search names in logs, terminal stdout, and system notifications
redact_names_in_logs = true

# Whether to keep recording audio files of WhatsApp voice commands
keep_whatsapp_audio = false

# When WhatsApp is frontmost during dictation or notes, whether to keep the audio recording
keep_audio_when_whatsapp_front = false

# Whether to save session audio as WAV files in recordings_dir.
# false (default): audio is transcribed from memory and never written to disk.
# true: keep recent recordings for debugging or for building a benchmark set.
# The two WhatsApp settings above still delete WhatsApp audio even when this is true.
keep_recordings = false


[vocabulary]
# Personal word list: names and terms you want spelled right, one per line.
# Used in dictation and notes only (never commands): hinted to Whisper, and close
# mishearings are fixed afterwards ("Rahool" -> "Rahul"). Edit it from the menu bar:
# "Edit Word List...". Kept outside the project folder because names are personal data.
enabled = true
file = "~/Library/Application Support/VoiceAssistant/vocabulary.txt"

# Most terms hinted to Whisper per chunk. The hint is also capped at ~400 characters,
# because long hints can make Whisper invent words.
max_prompt_terms = 50

# Fix close mishearings of listed words after transcription. Strict: ordinary English
# words are never changed, only near-misses of your listed names and terms.
auto_correct = true
